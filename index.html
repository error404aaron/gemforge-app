    <script>
      (function () {
        function fail() {
          var boot = document.getElementById('boot')
          if (!boot) return
          boot.innerHTML = 'GEMFORGE<small>The forge failed to light. Check your connection and try again.</small>' +
            '<button type="button" onclick="location.reload()">Reload</button>'

        setTimeout(fail, 10000)
      })()
